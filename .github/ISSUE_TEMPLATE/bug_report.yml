name: 🐛 Bug Report
description: Report a bug so it can be fixed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      placeholder: "When I try to ..., the app ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "Environment (device / OS / app version)"